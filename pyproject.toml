[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leadsweep"
version = "1.0.0"
description = "Self-hosted lead discovery: find buying-intent posts on X, Reddit and Telegram and qualify them with an LLM."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "LeadSweep contributors"}]
keywords = ["lead-generation", "social-listening", "buying-intent", "twitter", "reddit", "telegram", "langgraph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "playwright>=1.47",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "mcp>=1.10,<2",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    "langchain-groq>=1.0,<2",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "typer>=0.12",
    "rich>=13.0",
    "telethon>=1.36.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.0",
    "tzdata>=2024.1",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
leadsweep = "leadsweep.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["leadsweep*"]

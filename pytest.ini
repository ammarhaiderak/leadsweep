[pytest]
pythonpath = .
testpaths = tests
# Marks used by the suite so `--strict-markers` can catch typos.
markers =
    slow: tests that take noticeable time
    anyio: async tests driven by the anyio plugin
    live: would perform real network/browser work (never run by default)
filterwarnings =
    default
    ignore::DeprecationWarning:langgraph.*
    ignore::DeprecationWarning:langchain_core.*